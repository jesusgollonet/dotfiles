# sources:
# - http://zanshin.net/2013/09/05/my-tmux-configuration/
# - http://www.hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

unbind C-b
set-option -g prefix `
bind ` send-prefix

# Set the default terminal mode to 256color mode
set -g default-terminal "screen-256color"

#set-option -g default-command "reattach-to-user-namespace -l zsh"

# shorten command delay
set -sg escape-time 1

# set window and pane index to 1 (0 by default)
set-option -g base-index 1
setw -g pane-base-index 1

# soften status bar color from harsh green to light gray
set -g status-bg '#666666'
set -g status-fg '#aaaaaa'


# both ⏪ F7 and ⏩ F9 cycle through tmux sessions
bind-key -n F7 switch-client -p
bind-key -n F9 switch-client -n

bind-key -n F10 detach
# Use vim keybindings in copy mode
setw -g mode-keys vi
# map Vi movement keys as pane movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# copy filename from vim in left pane (assumes vim is running in the left pane)
bind y select-pane -L \; send-keys Escape "," cp \; select-pane -l
# copy filename from vim in left pane and paste it into current pane
bind Y select-pane -L \; send-keys Escape ",cp" \; select-pane -l \; run-shell "sleep 0.3 && tmux paste-buffer"

# reload ~/.tmux.conf using PREFIX r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Prefix g, then v/c/x opens Vim/Claude/Codex to the right.
# Use uppercase V/C/X to open the same program below instead.
# Keep the usual prefix % and prefix " split bindings available.
bind g switch-client -T launch-pane
bind -T launch-pane v split-window -h -c "#{pane_current_path}" 'exec vim'
bind -T launch-pane c split-window -h -c "#{pane_current_path}" 'exec claude'
bind -T launch-pane x split-window -h -c "#{pane_current_path}" 'exec codex'
bind -T launch-pane V split-window -v -c "#{pane_current_path}" 'exec vim'
bind -T launch-pane C split-window -v -c "#{pane_current_path}" 'exec claude'
bind -T launch-pane X split-window -v -c "#{pane_current_path}" 'exec codex'

# collapse splits while keeping 10% visible
# left arrow = left pane goes big, right arrow = right pane goes big
bind Left resize-pane -t 2 -x 90%
bind Right resize-pane -t 1 -x 90%
bind Up resize-pane -x 50%


bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "OSC52_TTY=#{pane_tty} ~/.dotfiles/bin/pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "OSC52_TTY=#{pane_tty} ~/.dotfiles/bin/pbcopy"
unbind -T copy-mode-vi Enter

bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "OSC52_TTY=#{pane_tty} ~/.dotfiles/bin/pbcopy"


# status bar
setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour00]:#[fg=colour255]#W#[fg=colour50]#F '

# pane border titles — colour by app label from color-panes (@pane_label):
# vim=green, claude=magenta, codex=yellow, other=grey; active title is bold.
# Claude's process name is a version (e.g. 2.1.306); color-panes maps that to "claude".
set -g pane-border-status top
set -g pane-border-format ' #{?#{==:#{@pane_label},vim},#[fg=colour114],#{?#{==:#{@pane_label},claude},#[fg=colour213],#{?#{==:#{@pane_label},codex},#[fg=colour221],#[fg=colour250]}}}#{?pane_active,#[bold],} #{pane_index}: #{?#{@pane_label},#{@pane_label},#{pane_current_command}} '
set -g pane-border-style fg=colour245
set -g pane-active-border-style fg=colour81,bg=default
set -g window-style 'fg=colour247,bg=colour236'
set -g window-active-style 'fg=default,bg=colour234'

# hooks
set-hook -g after-new-session 'run-shell "~/.dotfiles/tmux/bin/set-session-colour"'
set-hook -g after-split-window 'run-shell "~/.dotfiles/tmux/bin/color-panes"'
set-hook -g after-new-window 'run-shell "~/.dotfiles/tmux/bin/color-panes"'
set-hook -g pane-focus-in 'run-shell "~/.dotfiles/tmux/bin/color-panes"'

# Send selections through the helper with the explicit pane TTY above. tmux's
# native OSC 52 uses an empty selector, but Mosh 1.4 forwards only selector c.
set -s set-clipboard off
set -g allow-passthrough on
set -as terminal-features ',*:clipboard'
