# Atuin config — symlinked to ~/.config/atuin/config.toml
# Full reference: https://docs.atuin.sh/configuration/config/

# Enter runs the selected command immediately (Tab to edit first)
enter_accept = true

# Ctrl-R: search all history
filter_mode = "global"

# Up arrow: only history from the current directory
filter_mode_shell_up_key_binding = "directory"
